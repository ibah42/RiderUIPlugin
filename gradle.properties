# Целевая IDE для сборки плагина.
#   RD = Rider, IC = IntelliJ IDEA Community (нужна, если хочешь просто быстро скомпилировать —
#   качается в разы меньше, а все используемые API платформенные и есть в обеих).
platformType=RD
platformVersion=2026.2.2

# Нижняя граница совместимости. 252 = 2025.2. API фолдинга/инлеев стабильно много лет.
pluginSinceBuild=252

org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.stdlib.default.dependency=false
