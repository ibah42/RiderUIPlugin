# Целевая IDE для сборки плагина.
#   RD = Rider, IC = IntelliJ IDEA Community (качается в разы меньше — все используемые
#   API платформенные и есть в обеих, так что отлаживать логику удобнее на IC).
platformType=RD
platformVersion=2026.2.2

# Нижняя граница совместимости. 252 = 2025.2. API фолдинга/инлеев стабильно много лет.
pluginSinceBuild=252

org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
org.gradle.caching=true

# IntelliJ Platform Gradle Plugin местами не дружит с configuration cache
# (особенно runIde). Включишь — включай осознанно.
org.gradle.configuration-cache=false

# stdlib приходит из самой IDE; свой бандлить нельзя — будет конфликт версий.
kotlin.stdlib.default.dependency=false
